name: CI/CD Worker (UAT + Prod)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Secrets del repositorio (Settings > Secrets and variables > Actions)
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build + pruebas unitarias + cobertura + artifact
  # ─────────────────────────────────────────────
  build-test:
    name: Build & Test (UAT)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # para publicar los resultados de las pruebas
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # wrangler deploy --dry-run --outdir dist

      - name: Run unit tests with coverage
        run: npm run test:ci # genera test-results/junit.xml y coverage/

      - name: Publish test results (JUnit)
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Vitest Unit Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Coverage Report", "", "| Métrica | % | Cubierto |", "|---|---|---|",
              row("statements"), row("branches"), row("functions"), row("lines")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: dist/
          retention-days: 7

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            test-results/
            coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Deploy al Worker actual (Dev)
  # ─────────────────────────────────────────────
  deploy-dev:
    name: Deploy Dev
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: dist

      - name: Deploy to Cloudflare Workers (Dev)
        run: npx wrangler deploy dist/index.js --no-bundle

  # ─────────────────────────────────────────────
  # JOB 3: Deploy al proyecto NUEVO de Producción
  # ─────────────────────────────────────────────
  deploy-prod:
    name: Deploy Prod
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: dist

      - name: Create tables in Prod database (D1 migrations)
        run: npx wrangler d1 migrations apply practica7-prod --remote --env production

      - name: Deploy to Cloudflare Workers (Prod)
        run: npx wrangler deploy dist/index.js --no-bundle --env production
